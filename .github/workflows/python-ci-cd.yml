name: Python CI/CD
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # Forzamos la instalación desde la raíz
          if [ -f requirements.txt ]; then 
            pip install -r requirements.txt
          elif [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          else
            echo "Archivo requirements.txt no encontrado, instalando básicos..."
            pip install numpy paho-mqtt influxdb-client pytest
          fi

      - name: Ejecutar tests con pytest
        run: |
          # Usamos python -m pytest para asegurar que el path actual se incluya
          python -m pytest backend/test