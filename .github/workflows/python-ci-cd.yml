name: Python CI/CD
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # Verifica si tienes un requirements.txt en la raíz o en backend
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ejecutar tests con pytest
        run: |
          pip install pytest
          # Ejecuta pytest apuntando a tu carpeta 'backend/test'
          pytest backend/test